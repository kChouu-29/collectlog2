version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: nginxx
    ports:
      - "8081:80"
    volumes:
      - ./configs/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx_logs:/var/log/nginx
    networks:
      - elk

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.0
    container_name: filebeatt
    volumes:
      - ./configs/filebeat.yml:/usr/share/filebeat/filebeat.yml
      - ./nginx_logs:/var/log/nginx
    user: root
    networks:
      - elk
    depends_on:
      - nginx
      - golang-collector

  golang-collector:
    build: .
    container_name: golang-collector
    ports:
      - "8082:8082"
    networks:
      - elk
    depends_on:
      - elasticsearch

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: elasticsearch1
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9201:9201"
    networks:
      - elk

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: kibanaa
    ports:
      - "5602:5602"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - elk

networks:
  elk:
    driver: bridge
